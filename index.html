href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{

background:
linear-gradient(rgba(0,25,55,.55),rgba(0,25,55,.75)),
url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1800&q=80");

background-size:cover;
background-position:center;
background-attachment:fixed;

display:flex;
justify-content:center;
align-items:center;

min-height:100vh;
padding:25px;

}

.card{

width:100%;
max-width:430px;

backdrop-filter:blur(18px);
background:rgba(255,255,255,.14);

border:1px solid rgba(255,255,255,.25);

border-radius:30px;

padding:35px;

box-shadow:0 20px 50px rgba(0,0,0,.35);

text-align:center;

animation:fadeUp 1s;

}

.logo{

width:130px;
height:130px;

border-radius:50%;

border:5px solid white;

object-fit:cover;

box-shadow:0 10px 30px rgba(0,0,0,.3);

}

h1{

margin-top:20px;
font-size:30px;
font-weight:800;

color:white;

}

h2{

font-size:16px;
font-weight:400;

margin-top:8px;

color:#d8f5ff;

}

hr{

margin:25px auto;

width:80px;

border:none;
height:3px;

background:#38bdf8;

border-radius:30px;

}

.link{

display:flex;

align-items:center;

justify-content:center;

gap:15px;

text-decoration:none;

padding:17px;

margin:15px 0;

border-radius:16px;

background:white;

color:#003554;

font-weight:700;

font-size:18px;

transition:.35s;

box-shadow:0 10px 25px rgba(0,0,0,.15);

}

.link i{

font-size:24px;

width:30px;

}

.link:hover{

transform:translateY(-4px) scale(1.03);

background:#0ea5e9;

color:white;

}

.footer{

margin-top:25px;

font-size:14px;

color:white;

opacity:.85;

}

.wave{

position:fixed;

bottom:0;
left:0;

width:100%;

opacity:.35;

}

@keyframes fadeUp{

from{
opacity:0;
transform:translateY(40px);
}

to{
opacity:1;
transform:translateY(0);
}

}
.designer{
    color:#ffffff;
    font-size:14px;
    margin-bottom:15px;
    opacity:.9;
}

.contact-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:10px;

    padding:12px 28px;
    border-radius:50px;

    text-decoration:none;
    font-weight:700;
    font-size:15px;

    color:#fff;

    background:linear-gradient(135deg,#00b4d8,#0077b6);

    box-shadow:0 10px 25px rgba(0,180,216,.35);

    transition:all .35s ease;
}

.contact-btn i{
    font-size:16px;
}

.contact-btn:hover{
    transform:translateY(-4px) scale(1.06);
    background:linear-gradient(135deg,#38bdf8,#0096c7);
    box-shadow:0 15px 35px rgba(0,180,216,.55);
}

.contact-btn:active{
    transform:scale(.97);
}
</style>

</head>

<body>

<div class="card">

<img src="logo.jpg" class="logo"alt="Royal Caravan Hurghada Logo">

<h1>Royal Caravan Hurghada</h1>
