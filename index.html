<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Royal Caravan Hurghada</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo',sans-serif;
}

body{

    background:
    linear-gradient(rgba(0,25,55,.55),rgba(0,25,55,.75)),
    url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1800&q=80");

    background-size:cover;
    background-position:center;
    background-attachment:fixed;

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:100vh;

    padding:25px;

}


/* =========================
   MAIN CARD
========================= */

.card{

    width:100%;
    max-width:430px;

    backdrop-filter:blur(18px);

    background:rgba(255,255,255,.14);

    border:1px solid rgba(255,255,255,.25);

    border-radius:30px;

    padding:35px;

    box-shadow:0 20px 50px rgba(0,0,0,.35);

    text-align:center;

    animation:fadeUp 1s;

}


/* =========================
   LOGO
========================= */

.logo{

    width:130px;
    height:130px;

    border-radius:50%;

    border:5px solid white;

    object-fit:cover;

    box-shadow:0 10px 30px rgba(0,0,0,.3);

}


/* =========================
   TITLES
========================= */

h1{

    margin-top:20px;

    font-size:30px;

    font-weight:800;

    color:white;

}

h2{

    font-size:16px;

    font-weight:400;

    margin-top:8px;

    color:#d8f5ff;

}


/* =========================
   LINE
========================= */

hr{

    margin:25px auto;

    width:80px;

    border:none;

    height:3px;

    background:#38bdf8;

    border-radius:30px;

}


/* =========================
   SOCIAL LINKS
========================= */

.link{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:15px;

    text-decoration:none;

    padding:17px;

    margin:15px 0;

    border-radius:16px;

    background:white;

    color:#003554;

    font-weight:700;

    font-size:18px;

    transition:.35s;

    box-shadow:0 10px 25px rgba(0,0,0,.15);

}

.link i{

    font-size:24px;

    width:30px;

}

.link:hover{

    transform:translateY(-4px) scale(1.03);

    background:#0ea5e9;

    color:white;

}


/* =========================
   RATING BOX
========================= */

.rating-box{

    margin-top:25px;

    padding:25px 20px;

    border-radius:22px;

    background:rgba(255,255,255,.12);

    border:1px solid rgba(255,255,255,.25);

    backdrop-filter:blur(10px);

    box-shadow:0 10px 30px rgba(0,0,0,.15);

}

.rating-box h3{

    color:white;

    font-size:21px;

    margin-bottom:7px;

}

.rating-box p{

    color:#d8f5ff;

    font-size:13px;

    margin-bottom:15px;

}


/* =========================
   STARS
========================= */

.stars{

    display:flex;

    justify-content:center;

    gap:8px;

    direction:ltr;

    margin:12px 0;

}

.stars i{

    font-size:30px;

    color:rgba(255,255,255,.35);

    cursor:pointer;

    transition:.25s;

}

.stars i:hover{

    transform:scale(1.2);

}

.stars i.active{

    color:#ffd700;

    filter:drop-shadow(0 0 7px rgba(255,215,0,.6));

}


/* =========================
   RATING TEXT
========================= */

#ratingText{

    color:white;

    font-size:14px;

    margin:8px 0 15px;

}


/* =========================
   REVIEW TEXTAREA
========================= */

#review{

    width:100%;

    min-height:90px;

    resize:none;

    border:none;

    outline:none;

    border-radius:15px;

    padding:14px;

    font-family:'Cairo',sans-serif;

    font-size:14px;

    background:rgba(255,255,255,.95);

    color:#003554;

    margin-bottom:12px;

}

#review::placeholder{

    color:#777;

}


/* =========================
   WHATSAPP BUTTON
========================= */

.send-rating{

    width:100%;

    border:none;

    outline:none;

    padding:14px;

    border-radius:50px;

    background:linear-gradient(135deg,#25D366,#128C7E);

    color:white;

    font-family:'Cairo',sans-serif;

    font-size:15px;

    font-weight:700;

    cursor:pointer;

    box-shadow:0 10px 25px rgba(37,211,102,.3);

    transition:.3s;

}

.send-rating:hover{

    transform:translateY(-3px) scale(1.02);

    box-shadow:0 15px 35px rgba(37,211,102,.5);

}

.send-rating:active{

    transform:scale(.97);

}

.send-rating i{

    margin-right:7px;

    font-size:18px;

}


/* =========================
   FOOTER
========================= */

.footer{

    margin-top:25px;

    font-size:14px;

    color:white;

    opacity:.85;

}


/* =========================
   DESIGNER
========================= */

.designer{

    color:#ffffff;

    font-size:14px;

    margin-bottom:15px;

    opacity:.9;

}


/* =========================
   CONTACT BUTTON
========================= */

.contact-btn{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    gap:10px;

    padding:12px 28px;

    border-radius:50px;

    text-decoration:none;

    font-weight:700;

    font-size:15px;

    color:#fff;

    background:linear-gradient(135deg,#00b4d8,#0077b6);

    box-shadow:0 10px 25px rgba(0,180,216,.35);

    transition:all .35s ease;

}

.contact-btn i{

    font-size:16px;

}

.contact-btn:hover{

    transform:translateY(-4px) scale(1.06);

    background:linear-gradient(135deg,#38bdf8,#0096c7);

    box-shadow:0 15px 35px rgba(0,180,216,.55);

}

.contact-btn:active{

    transform:scale(.97);

}


/* =========================
   ANIMATION
========================= */

@keyframes fadeUp{

    from{

        opacity:0;

        transform:translateY(40px);

    }

    to{

        opacity:1;

        transform:translateY(0);

    }

}


/* =========================
   MOBILE
========================= */

@media(max-width:480px){

    body{

        padding:15px;

    }

    .card{

        padding:25px 18px;

        border-radius:25px;

    }

    .logo{

        width:110px;

        height:110px;

    }

    h1{

        font-size:25px;

    }

    h2{

        font-size:14px;

    }

    .link{

        font-size:16px;

        padding:15px;

    }

    .stars i{

        font-size:27px;

    }

}

</style>

</head>


<body>


<div class="card">


    <!-- LOGO -->

    <img
        src="logo.jpg"
        class="logo"
        alt="Royal Caravan Hurghada Logo"
    >


    <!-- TITLE -->

    <h1>
        Royal Caravan Hurghada
    </h1>


    <h2>
        Sea Trips • Snorkeling • Diving • Safari • Airport
    </h2>


    <hr>


    <!-- WEBSITE -->

    <a
        class="link"
        href="https://www.royalcaravan-hurghada.com/"
        target="_blank"
    >

        <i class="fa-solid fa-globe"></i>

        Website

    </a>


    <!-- FACEBOOK -->

    <a
        class="link"
        href="https://www.facebook.com/share/1BuWTxUmLT/"
        target="_blank"
    >

        <i class="fab fa-facebook-f"></i>

        Facebook

    </a>


    <!-- INSTAGRAM -->

    <a
        class="link"
        href="https://www.instagram.com/royalcaravanhurghada?utm_source=qr&igsh=bm94aGM4MzEwamN6&igsi=bm94aGM4MzEwamN6"
        target="_blank"
    >

        <i class="fab fa-instagram"></i>

        Instagram

    </a>


    <!-- TIKTOK -->

    <a
        class="link"
        href="https://www.tiktok.com/@royal.caravan0?_r=1&_t=ZS-98pRA2TYnuj"
        target="_blank"
    >

        <i class="fab fa-tiktok"></i>

        TikTok

    </a>


    <!-- =========================
         RATING SECTION
    ========================= -->

    <div class="rating-box">


        <h3>
            ⭐ Rate Your Experience
        </h3>


        <p>
            How was your experience with Royal Caravan Hurghada?
        </p>


        <!-- STARS -->

        <div class="stars" id="stars">

            <i
                class="fa-solid fa-star"
                data-rating="1"
            ></i>

            <i
                class="fa-solid fa-star"
                data-rating="2"
            ></i>

            <i
                class="fa-solid fa-star"
                data-rating="3"
            ></i>

            <i
                class="fa-solid fa-star"
                data-rating="4"
            ></i>

            <i
                class="fa-solid fa-star"
                data-rating="5"
            ></i>

        </div>


        <!-- RATING TEXT -->

        <div id="ratingText">

            Select your rating

        </div>


        <!-- REVIEW -->

        <textarea
            id="review"
            placeholder="Write your review..."
        ></textarea>


        <!-- SEND -->

        <button
            class="send-rating"
            onclick="sendRating()"
        >

            <i class="fab fa-whatsapp"></i>

            Send Rating via WhatsApp

        </button>


    </div>


    <!-- FOOTER -->

    <div
        class="footer"
        id="footer"
    >

        Designed by Mansour Khalifa

        <br>

        <a
            href="https://link.gettap.co/mnswrkhlyfh8103175"
            target="_blank"
            class="contact-btn"
        >

            <i class="fa-solid fa-envelope"></i>

            Contact us

        </a>

    </div>


</div>



<script>


/* =========================
   RATING SYSTEM
========================= */

let selectedRating = 0;


const stars =
    document.querySelectorAll("#stars i");


const ratingText =
    document.getElementById("ratingText");


const ratingMessages = {

    1: "Very Bad 😞",

    2: "Bad 😕",

    3: "Good 🙂",

    4: "Very Good 😊",

    5: "Excellent 🤩"

};



stars.forEach(star => {


    star.addEventListener(
        "click",
        function(){

            selectedRating =
                Number(this.dataset.rating);


            stars.forEach(s => {

                s.classList.remove("active");


                if(
                    Number(s.dataset.rating)
                    <= selectedRating
                ){

                    s.classList.add("active");

                }

            });


            ratingText.innerText =
                ratingMessages[selectedRating];

        }

    );

});



/* =========================
   SEND TO WHATSAPP
========================= */

function sendRating(){


    /*

    ضع رقم واتساب Royal Caravan هنا

    مصر مثال:

    201234567890

    بدون علامة +

    */

    const whatsappNumber =
        "201001532312";


    /* CHECK RATING */

    if(selectedRating === 0){

        alert(
            "Please select your rating first ⭐"
        );

        return;

    }


    /* GET REVIEW */

    const review =
        document
        .getElementById("review")
        .value
        .trim();


    /* CHECK REVIEW */

    if(review === ""){

        alert(
            "Please write your review first ✍️"
        );

        return;

    }


    /* CREATE STARS */

    const starText =
        "⭐".repeat(selectedRating);


    /* WHATSAPP MESSAGE */

    const message =

`⭐ Royal Caravan Hurghada - Customer Review

Rating:
${starText}

Review:
${review}

Thank you ❤️`;


    /* WHATSAPP URL */

    const whatsappURL =

        "https://wa.me/" +

        whatsappNumber +

        "?text=" +

        encodeURIComponent(message);


    /* OPEN WHATSAPP */

    window.open(
        whatsappURL,
        "_blank"
    );

}

</script>


</body>

</html>
